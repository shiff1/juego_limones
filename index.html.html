<!DOCTYPE html>
<html>
<head>
  <title>Caza Estrellas</title>
  <link rel="stylesheet" href="limones.css">
  <script src="utils.js"></script>
</head>

<body onload="iniciar();">

  <div class="contenedor">

    <div class="encabezado">
      <div class="etiqueta">🍋 JUEGO ARCADE</div>
      <div class="logo-superior">
         <img src="limon.png" alt="Limón loco" width="200">
       </div>

      <h1>Atrapar Limones</h1>

      <p>
        Si del cielo te caen limones... ¡atrápalos todos!
      </p>

      <h2>Autor: Shirley Leon</h2>
    </div>

    <div class="marco-juego">
      <canvas id="areaJuego" width="600" height="400"></canvas>
    </div>

    <div class="panel">

      <div class="estadistica">
        <span class="icono">🏆</span>

        <div>
          <span class="etiqueta-estadistica">
            PUNTAJE
          </span>

          <strong id="txtPuntaje">0</strong>
        </div>
      </div>

      <div class="separador"></div>

      <div class="estadistica">
        <span class="icono">❤️</span>

        <div>
          <span class="etiqueta-estadistica">
            VIDAS
          </span>

          <strong id="txtVidas">3</strong>
        </div>
      </div>

    </div>

    <div class="botones">

      <button onclick="moverIzquierda()">
        ← Izquierda
      </button>

      <button onclick="moverDerecha()">
        Derecha →
      </button>

      <button>
        ↻ Reiniciar
      </button>

    </div>

    <p class="instruccion">
      Usa los botones para mover al personaje y atrapar los limones.
    </p>

  </div>

  <script src="limones.js"></script>

</body>
</html>
